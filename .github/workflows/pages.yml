name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build walkway map from OpenStreetMap
        run: node scripts/build-paths.mjs
        continue-on-error: true
      # Keep the latest walkway map in the repo so a later deploy still has it if OpenStreetMap is busy.
      - name: Save walkway map
        run: |
          if [ -f paths.json ] && [ -n "$(git status --porcelain paths.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paths.json
            git commit -m "Update walkway map from OpenStreetMap"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
